name: elsa-depression
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - pyreadstat          # reads .dta Stata files
  - scikit-learn
  - matplotlib
  - seaborn
  - statsmodels
  - jupyter
  - ipykernel
  - pip:
    - shap
    - xgboost
    - lightgbm
